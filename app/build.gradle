plugins { id 'com.android.application' }
android {
 namespace 'vn.streampocket.mobile'
 compileSdk 35
 defaultConfig {
  applicationId 'vn.streampocket.mobile'
  minSdk 29
  targetSdk 35
  versionCode 10
  versionName '1.1.5'
  testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
  ndk { abiFilters 'arm64-v8a', 'x86_64' }
 }
 buildFeatures { buildConfig true }
 signingConfigs {
  published {
   def keyPath = System.getenv('STREAM_POCKET_KEYSTORE') ?: rootProject.file('.signing/stream-pocket.keystore').path
   storeFile file(keyPath)
   storePassword System.getenv('STREAM_POCKET_STORE_PASSWORD') ?: 'android'
   keyAlias System.getenv('STREAM_POCKET_KEY_ALIAS') ?: 'androiddebugkey'
   keyPassword System.getenv('STREAM_POCKET_KEY_PASSWORD') ?: 'android'
  }
 }
 buildTypes { release { minifyEnabled false; signingConfig signingConfigs.published } }
 compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 packaging { jniLibs { useLegacyPackaging false }; resources { excludes += ['META-INF/DEPENDENCIES'] } }
}
dependencies {
 coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
 implementation 'androidx.webkit:webkit:1.12.1'
 implementation 'androidx.documentfile:documentfile:1.0.1'
 implementation 'androidx.media3:media3-exoplayer:1.5.1'
 implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
 implementation 'androidx.media3:media3-datasource-okhttp:1.5.1'
 implementation 'androidx.media3:media3-ui:1.5.1'
 implementation 'androidx.media3:media3-transformer:1.5.1'
 implementation 'androidx.media3:media3-effect:1.5.1'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'org.jsoup:jsoup:1.18.3'
 implementation 'dev.ffmpegkit-maintained:ffmpeg-kit-min:6.0.3'
 // The maintained AAR's POM omits this runtime dependency required by FFmpegKitConfig.
 implementation 'com.arthenica:smart-exception-java:0.2.1'
 testImplementation 'junit:junit:4.13.2'
 testImplementation 'org.json:json:20240303'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
